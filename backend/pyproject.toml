[project]
name = "backend"
version = "0.1.0"
description = "FastAPI telemetry ingestion service for MXChip room telemetry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "influxdb-client>=1.50.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
