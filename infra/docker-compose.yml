services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - grafana

  api:
    build:
      context: ../backend
    image: ${BACKEND_IMAGE}
    environment:
      APP_NAME: mxchip-room-telemetry
      INFLUX_URL: http:§//influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-mxchip}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-room_telemetry}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
    depends_on:
      - influxdb

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INFLUX_LOCAL_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-mxchip}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-room_telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${PUBLIC_HOST}
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      INFLUX_ORG: ${INFLUX_ORG:-mxchip}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-room_telemetry}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data:
