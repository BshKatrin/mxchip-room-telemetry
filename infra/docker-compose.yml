services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-8080}:81"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api
      - grafana

  api:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      APP_NAME: mxchip-room-telemetry
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-mxchip}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-room_telemetry}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
    depends_on:
      - influxdb

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INFLUX_LOCAL_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-mxchip}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-room_telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${PUBLIC_HOST}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_LOCAL_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      INFLUX_ORG: ${INFLUX_ORG:-mxchip}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-room_telemetry}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [tls]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  influxdb-data:
  grafana-data:
  letsencrypt:
  certbot-webroot:
